name: arrivesuite

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: arrivesuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arrivesuite
      POSTGRES_PASSWORD: arrivesuite_dev_password
      POSTGRES_DB: arrivesuite
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrivesuite -d arrivesuite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arrivesuite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO disabled: neither Docker Hub (minio/minio removed) nor
  # quay.io/minio/minio (401 from this network) is pullable here.
  # Re-enable when registry access allows. App + DB run without it.
  #minio:
  #  image: quay.io/minio/minio:latest
  #  container_name: arrivesuite-minio
  #  restart: unless-stopped
  #  command: server /data --console-address ":9001"
  #  environment:
  #    MINIO_ROOT_USER: arrivesuite_minio
  #    MINIO_ROOT_PASSWORD: arrivesuite_minio_password
  #  ports:
  #    - "9000:9000"
  #    - "9001:9001"
  #  volumes:
  #    - minio_data:/data
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
  #    interval: 10s
  #    timeout: 5s
  #    retries: 5
  #
  #minio-init:
  #  image: quay.io/minio/mc:latest
  #  depends_on:
  #    minio:
  #      condition: service_healthy
  #  entrypoint: >
  #    /bin/sh -c "
  #    mc alias set local http://minio:9000 arrivesuite_minio arrivesuite_minio_password;
  #    mc mb --ignore-existing local/arrivesuite-media;
  #    mc anonymous set download local/arrivesuite-media;
  #    echo 'MinIO bucket ready';
  #    "
  #  restart: "no"

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: arrivesuite-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arrivesuite:arrivesuite_dev_password@postgres:5432/arrivesuite
      REDIS_URL: redis://redis:6379
      WORKER_PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: arrivesuite-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  adminer:
    image: adminer:latest
    container_name: arrivesuite-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  redis_data:
  minio_data:
