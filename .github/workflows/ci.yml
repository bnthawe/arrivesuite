name: CI

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @arrivesuite/web lint

      - name: Typecheck web
        run: pnpm --filter @arrivesuite/web exec tsc --noEmit

      - name: Typecheck worker
        run: pnpm --filter @arrivesuite/worker typecheck

      - name: Typecheck types
        run: pnpm --filter @arrivesuite/types typecheck

      - name: Typecheck integrations
        run: pnpm --filter @arrivesuite/integrations typecheck

      - name: Typecheck pricing
        run: pnpm --filter @arrivesuite/pricing typecheck

      - name: Build web
        run: pnpm --filter @arrivesuite/web build
