name: CI

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arrivesuite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @arrivesuite/web lint

      - name: Typecheck web
        run: pnpm --filter @arrivesuite/web exec tsc --noEmit

      - name: Typecheck worker
        run: pnpm --filter @arrivesuite/worker typecheck

      - name: Typecheck types
        run: pnpm --filter @arrivesuite/types typecheck

      - name: Typecheck integrations
        run: pnpm --filter @arrivesuite/integrations typecheck

      - name: Typecheck pricing
        run: pnpm --filter @arrivesuite/pricing typecheck

      - name: Migrate and seed test database
        run: |
          pnpm --filter @arrivesuite/db db:migrate
          pnpm --filter @arrivesuite/db db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arrivesuite_test

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arrivesuite_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arrivesuite_test

      - name: Build web
        run: pnpm --filter @arrivesuite/web build
        env:
          # Satisfies the fail-fast DATABASE_URL check at module load.
          # No query runs during build.
          DATABASE_URL: postgresql://localhost:5432/ci
